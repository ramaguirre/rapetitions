<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Counts exercise reps from the camera, by itself.">
  <title>RApetitions</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>

    <header id="hud">
      <div id="count" aria-live="polite">0</div>
      <div id="status" data-i18n="ready">Ready</div>
      <div id="rest" hidden></div>
      <div id="sets"></div>
    </header>

    <canvas id="trace" aria-hidden="true"></canvas>

    <section id="intro">
      <h1>RApetitions</h1>
      <p data-i18n="intro1">Prop the phone up so your body is in view, then start your set.</p>
      <p data-i18n="intro2">After a few reps it finds the rhythm and counts by itself. The first reps are included.</p>
      <button id="start" class="primary" data-i18n="start">Start</button>
      <p id="loadmsg" class="small"></p>
      <button id="clipsintro" class="secondary" data-i18n="clips">Clips</button>
    </section>

    <nav id="controls" hidden>
      <button id="mode" title="Body / Motion"></button>
      <button id="flip" data-i18n="flip">Flip</button>
      <button id="voice"></button>
      <button id="clipsbtn"></button>
      <button id="endset" data-i18n="endset">End set</button>
      <button id="reset" data-i18n="reset">Reset</button>
      <button id="stop" data-i18n="stop">Stop</button>
    </nav>
    <section id="clips" hidden>
      <header>
        <h2 data-i18n="clips">Clips</h2>
        <button id="clipsclose" data-i18n="close">Close</button>
      </header>
      <label class="switch"><input type="checkbox" id="clipson"> <span data-i18n="clipsSave">Save one rep of each set as a looping clip</span></label>
      <p class="small" data-i18n="clipsPrivate">Clips stay on this phone. Nothing is uploaded; Share sends a clip only when you choose.</p>
      <p id="clipsinfo" class="small"></p>
      <ul id="cliplist"></ul>
    </section>
    <div id="awake" hidden></div>
    <div id="perf"></div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
